name: GEO scan

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scanner
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m scanner.main

      - name: Commit results
        run: |
          git config user.name "geo-scanner-bot"
          git config user.email "geo-scanner-bot@users.noreply.github.com"
          git add reports/ data/ docs/
          if git diff --cached --quiet; then
            echo "Geen wijzigingen"
          else
            git commit -m "scan: $(date -u +%Y-%m-%d)"
            git push
          fi
